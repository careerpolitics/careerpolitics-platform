name: Pull Request
on:
  pull_request_target:
    types: [opened]
jobs:
  pull_request_comment:
    name: Notify third-party contributor
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Add comment to PR if coming from third-party fork
        uses: mshick/add-pr-comment@v2
        with:
          message: |
            Thank you for opening this PR! We appreciate your contribution!

            Since this PR comes from a fork, a Career Politics team member will
            review it before CI pipelines run. We'll get back to you shortly!
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          repo-token-user-login: 'github-actions[bot]'
