# This workflow posts an automated comment on every new issue

name: Automatic Comment
on:
  issues:
    types: [opened]
permissions:
  contents: read

jobs:
  comment:
    permissions:
      issues: write
      pull-requests: write
    name: Comment
    runs-on: ubuntu-latest
    steps:
      - name: Automatic Comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            Thanks for opening this issue! The Career Politics team will review it and get back to you as soon as possible.

            - **Bugs**: Issues labeled `bug` are prioritized. Please include steps to reproduce if applicable.
            - **Feature requests**: Please wait until we add a `ready for dev` label before starting work on it.

            To claim an issue, leave a comment. If you need help, tag @careerpolitics-team.
