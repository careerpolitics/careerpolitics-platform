# This workflow posts an automated comment on every new issue

name: Automatic Comment
on:
  issues:
    types: [opened]
permissions:
  contents: read

jobs:
  comment:
    permissions:
      issues: write  # for peter-evans/create-or-update-comment to create or update comment
      pull-requests: write  # for peter-evans/create-or-update-comment to create or update comment
    name: Comment
    runs-on: ubuntu-latest
    steps:
      - name: Automatic Comment
        uses: peter-evans/create-or-update-comment@v5
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            Thanks for opening this issue! The Career Politics team will review it and get back to you as soon as possible.

            To claim an issue to work on, please leave a comment. If you've claimed the issue and need help, please ping @forem-team. The OSS Community Manager or the engineers on OSS rotation will follow up.

            For full info on how to contribute, please check out our [contributors guide](https://developers.forem.com/contributing-guide/forem).
            - **Bugs**: Issues labeled `bug` are prioritized. Please include steps to reproduce if applicable.
            - **Feature requests**: Please wait until we add a `ready for dev` label before starting work on it.

            To claim an issue, leave a comment. If you need help, tag @careerpolitics-team.
