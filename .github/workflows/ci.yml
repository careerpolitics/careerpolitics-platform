name: CI

on:
  pull_request:
    branches:
      - main
  merge_group:
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  COVERAGE: true
  RAILS_ENV: test
  NODE_ENV: test
  DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/careerpolitics_test
  DATABASE_NAME_TEST: careerpolitics_test
  POSTGRES_PASSWORD: postgres
  YARN_ENABLE_HARDENED_MODE: 0

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      E2E: true

    steps:
      - uses: actions/checkout@v6
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick
      - name: Cache pre-compiled assets
        uses: actions/cache@v5
        id: assetscache
        with:
          path: |
            public/assets
          key: ${{ runner.os }}-compiled-assets-v3-${{ hashFiles( 'app/assets/**', 'app/javascript/**', '**/package.json', '**/yarn.lock') }}
          restore-keys: ${{ runner.os }}-compiled-assets-v3-
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: yarn
        if: steps.assetscache.outputs.cache-hit != 'true'
      - run: yarn install --immutable
        if: steps.assetscache.outputs.cache-hit != 'true'
      - run: bundle exec rails assets:precompile
        if: steps.assetscache.outputs.cache-hit != 'true'

  rspec:
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 30


    strategy:
      fail-fast: false
      matrix:
        ci_node_total: [4]
        ci_node_index: [0, 1, 2, 3]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        # ADDED: Options to make the healthcheck more reliable
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis
        ports:
          - 6379:6379
        # ADDED: Options to make the healthcheck more reliable
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6
      - name: Restore compiled assets
        uses: actions/cache/restore@v5
        with:
          fail-on-cache-miss: true
          path: |
            public/assets
          key: ${{ runner.os }}-compiled-assets-v3-${{ hashFiles('app/assets/**', 'app/javascript/**', '**/package.json', '**/yarn.lock') }}
          restore-keys: ${{ runner.os }}-compiled-assets-v3-
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      # MODIFIED: Added postgresql-client and redis-tools for the wait step
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      # NEW: This is the fix. It waits until Postgres and Redis are fully ready
      - name: Wait for services
        run: |
          echo "Waiting for Postgres..."
          until pg_isready -h localhost -p 5432 -U postgres; do
            sleep 2
          done
          echo "Postgres is ready."

          echo "Waiting for Redis..."
          until redis-cli -h localhost -p 6379 ping; do
            sleep 2
          done
          echo "Redis is ready."

      - run: cp .env_sample .env

      # MODIFIED: Replaced db:test:prepare with the more explicit, modern commands
      - name: Setup Database
        run: |
          bin/rails db:create
          bin/rails db:schema:load
          bin/rails javascript:build

      - name: RSpec
        env:
          CI_NODE_TOTAL: ${{ matrix.ci_node_total }}
          CI_NODE_INDEX: ${{ matrix.ci_node_index }}
        run: |
          SPECS=$(find spec -name '*_spec.rb' | sort | awk "NR % $CI_NODE_TOTAL == $CI_NODE_INDEX")
          echo "Running $(echo "$SPECS" | wc -l) spec files on node $CI_NODE_INDEX/$CI_NODE_TOTAL"
          bundle exec rspec --force-color --format documentation --format RspecJunitFormatter --out tmp/rspec.xml $SPECS
      - name: Upload RSpec artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: rspec-artifacts-${{ matrix.ci_node_index }}
          path: tmp/capybara
      - name: Rename folder
        run: if [ -d "coverage/simplecov" ]; then mv coverage/simplecov coverage/simplecov-${{ matrix.ci_node_index }}; fi
      - name: Upload test coverage result
        uses: actions/upload-artifact@v4
        with:
          name: coverage-rspec-${{ matrix.ci_node_index }}
          path: coverage/
