name: CD

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  IMAGE_NAME: muraridevv/careerpolitics-platform
  KUBE_NAMESPACE: production

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v6

      - name: Set image tag
        id: meta
        run: echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          target: production
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          build-args: |
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: [build-and-push]
    concurrency: production
    environment: production

    steps:
      - uses: actions/checkout@v6

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Configure kubectl
        run: doctl kubernetes cluster kubeconfig save ${{ secrets.DOKS_CLUSTER_NAME }}

      # --- Apply app secrets from GitHub Environment Secrets ---
      - name: Apply app secrets
        run: |
          kubectl create secret generic careerpolitics-secrets \
            --from-literal=SECRET_KEY_BASE='${{ secrets.SECRET_KEY_BASE }}' \
            --from-literal=DATABASE_URL='${{ secrets.DATABASE_URL }}' \
            --from-literal=REDIS_URL='${{ secrets.REDIS_URL }}' \
            --from-literal=FOREM_OWNER_SECRET='${{ secrets.FOREM_OWNER_SECRET }}' \
            --from-literal=DO_SPACES_ACCESS_KEY_ID='${{ secrets.DO_SPACES_ACCESS_KEY_ID }}' \
            --from-literal=DO_SPACES_SECRET_ACCESS_KEY='${{ secrets.DO_SPACES_SECRET_ACCESS_KEY }}' \
            --from-literal=AWS_ID='${{ secrets.AWS_ID }}' \
            --from-literal=AWS_SECRET='${{ secrets.AWS_SECRET }}' \
            --from-literal=CLOUDINARY_API_KEY='${{ secrets.CLOUDINARY_API_KEY }}' \
            --from-literal=CLOUDINARY_API_SECRET='${{ secrets.CLOUDINARY_API_SECRET }}' \
            --from-literal=HONEYBADGER_API_KEY='${{ secrets.HONEYBADGER_API_KEY }}' \
            --from-literal=HONEYBADGER_JS_API_KEY='${{ secrets.HONEYBADGER_JS_API_KEY }}' \
            --from-literal=ALGOLIA_API_KEY='${{ secrets.ALGOLIA_API_KEY }}' \
            --from-literal=SMTP_USER_NAME='${{ secrets.SMTP_USER_NAME }}' \
            --from-literal=SMTP_PASSWORD='${{ secrets.SMTP_PASSWORD }}' \
            --namespace=${{ env.KUBE_NAMESPACE }} \
            --dry-run=client -o yaml | kubectl apply -f -

      # --- Run database migrations via a Kubernetes Job ---
      - name: Delete previous migration job (if any)
        run: kubectl delete job careerpolitics-migrate -n ${{ env.KUBE_NAMESPACE }} --ignore-not-found

      - name: Run database migrations
        run: |
          # Patch the migration job manifest to use the new image tag
          sed -i 's|^\(\s*image:\s*\).*|\1${{ env.IMAGE_NAME }}:${{ github.sha }}|' kube/job-migrate.yaml
          kubectl apply -f kube/job-migrate.yaml
          kubectl wait --for=condition=complete --timeout=300s job/careerpolitics-migrate -n ${{ env.KUBE_NAMESPACE }}

      - name: Check migration logs
        if: failure()
        run: kubectl logs job/careerpolitics-migrate -n ${{ env.KUBE_NAMESPACE }}

      - name: Cleanup migration job
        run: kubectl delete job careerpolitics-migrate -n ${{ env.KUBE_NAMESPACE }} --ignore-not-found

      # --- Deploy application ---
      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f kube/config-app.yaml
          kubectl apply -f kube/service-web.yaml
          kubectl apply -f kube/ingress.yaml

      - name: Update web deployment image
        run: |
          kubectl set image deployment/careerpolitics-web \
            web=${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -n ${{ env.KUBE_NAMESPACE }}

      - name: Update worker deployment image
        run: |
          kubectl set image deployment/careerpolitics-worker \
            worker=${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -n ${{ env.KUBE_NAMESPACE }}

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/careerpolitics-web -n ${{ env.KUBE_NAMESPACE }} --timeout=300s
          kubectl rollout status deployment/careerpolitics-worker -n ${{ env.KUBE_NAMESPACE }} --timeout=300s

      # --- Notifications ---
      - uses: honeybadger-io/github-notify-deploy-action@v1
        with:
          api_key: ${{ secrets.HONEYBADGER_API_KEY_RUBY }}

      - uses: honeybadger-io/github-notify-deploy-action@v1
        with:
          api_key: ${{ secrets.HONEYBADGER_API_KEY_JAVASCRIPT }}

  notify-slack:
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy]
    if: always()
    steps:
      - name: Notify Slack
        run: |
          BUILD="${{ needs.build-and-push.result }}"
          DEPLOY="${{ needs.deploy.result }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          SHA="${{ github.sha }}"
          ACTOR="${{ github.actor }}"

          if [[ "$BUILD" == "success" && "$DEPLOY" == "success" ]]; then
            EMOJI=":white_check_mark:"
            LABEL="Deployment succeeded"
          elif [[ "$BUILD" != "success" ]]; then
            EMOJI=":x:"
            LABEL="Build failed (deploy did not run)"
          else
            EMOJI=":x:"
            LABEL="Deployment failed"
          fi

          curl -s -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"channel\": \"${{ secrets.SLACK_DEPLOY_CHANNEL }}\",
              \"username\": \"deploy_bot\",
              \"icon_emoji\": \"$EMOJI\",
              \"text\": \"$EMOJI *$LABEL*\n*Commit:* \`${SHA:0:7}\`\n*Triggered by:* $ACTOR\n<$RUN_URL|View workflow run>\"
            }"
